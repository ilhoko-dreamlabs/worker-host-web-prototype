<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1260" viewBox="0 0 1920 1260" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">DreamLabs Worker Host 시스템 아키텍처 v4</title>
  <desc id="architecture-description">2026년 10월 8일 읽기 기준의 참조 구조. 중앙 업무 가이드 준비, Skill Registry의 선택 및 버전 관리, Worker별 설치·활성화·검증을 구분한다. 자동 일괄 배포를 뜻하지 않는다. 실제 실행은 사용자 미리보기·승인, Worker A의 outbound RRA Connector, 대상 Worker B의 별도 API key 및 admission, 결과 반환 순서다. 같은 세션의 후속 요청도 새 승인이 필요하다. 승인 범위는 정확히 대상 하나와 요청 하나이며, 권한 승계·자율 연쇄·팬아웃은 없고 Worker 간 첨부 전달은 보류다. 각 Worker는 Docker의 독립 컨테이너이며 Knowledge, Workspace, Skills, Adapters와 Tool Connector를 보유한다. Portainer는 컨테이너 관리 제어면이지 요청 라우터가 아니다. WorkMap, Key, SSOT, Approval, Tuner는 외부 통합 기능의 개념 및 구성 예시다. AgentOps의 GitLab CI, 불변 이미지 후보, site-local Update Manager의 통제된 변경을 실행 경계와 구분한다. 선택형 Worker Registry의 이미지 공급 및 토폴로지 가시성은 Skill Registry와 다르다. Zabbix 관찰, Telegram 알림, Mattermost 채널 연동은 환경별 검증이 필요하다. 2026년 10월 3일 worker0에서 worker1로 최초 및 후속 총 두 건, 중복 0건의 과거 한정 검증은 전체 Worker나 현재 가용성 증거가 아니다. Skill Registry 한 개 패키지 설치 관찰과 enable 및 injection 운영 수용 대기는 별개다. Context Selector 소스 검증은 완료되었지만 운영 기능 수용은 대기이며, 10월 7일의 이미지 관찰은 기능 검증 증거가 아니다. 개념 구조는 production-ready를 주장하지 않는다. 참조 SHA e962e7387968da6c1e8e274c708a4515f464c6f5.</desc>
