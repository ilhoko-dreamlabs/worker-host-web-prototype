name: Publish GitHub Pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Keep video binaries outside the Pages payload
        run: find out/media/use-cases -type f -name 'scenario-v5.mp4' -delete

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          touch out/.nojekyll

          remote_sha="$(git ls-remote --heads origin refs/heads/gh-pages | cut -f1)"
          publish_parent="$(mktemp -d)"
          publish_dir="${publish_parent}/site"
          git worktree add --detach "${publish_dir}" HEAD
          trap 'git worktree remove --force "${publish_dir}"' EXIT

          git -C "${publish_dir}" switch --orphan gh-pages
          cp -a out/. "${publish_dir}/"
          git -C "${publish_dir}" add --all
          git -C "${publish_dir}" config user.name "github-actions[bot]"
          git -C "${publish_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${publish_dir}" commit -m "deploy: ${GITHUB_SHA}"

          if [[ -n "${remote_sha}" ]]; then
            git -C "${publish_dir}" push \
              --force-with-lease="refs/heads/gh-pages:${remote_sha}" \
              origin HEAD:refs/heads/gh-pages
          else
            git -C "${publish_dir}" push \
              --force-with-lease="refs/heads/gh-pages:" \
              origin HEAD:refs/heads/gh-pages
          fi

      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
